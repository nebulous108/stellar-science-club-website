<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scaled=1.0">
    <meta name="description" content="Stellar Science Club — An Australian-focused science community on Discord.">
    <title> Features Stellar Science Club</title><style>
        :root {
            --bg:#05060d; --panel:#0b0d17; --panel:#101323; --line:rgba(255,255,255,0.1);
            --text:#f7f7fb; --muted:#a8aec3; --purple:#7c3aed; --purple2:#9b5cff;
            --cyan:#12d9ff; --pink:#d946ef; --green:#35e6a0;
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.65}
        a{color:inherit;text-decoration:none}
        .space{position:fixed;inset:0;pointer-events:none;z-index:-2;background:
            radial-gradient(circle at 15% 15%,rgba(124,58,237,.18),transparent 25%),
            radial-gradient(circle at 80% 20%,rgba(18,217,255,.10),transparent 22%),
            radial-gradient(circle at 50% 80%,rgba(217,70,239,.08),transparent 30%),
            linear-gradient(180deg,#05060d,#060712 60%,#05060d)
        }
        .space:after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:97px 97px}
        .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 max(28px,calc((100vw - 1180px)/2));border-bottom:1px solid rgba(255,255,255,.07);background:rgba(5,6,13,.78);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
        .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;white-space:nowrap;}.brand b{color:var(--purple2)}
        .brand-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(124,58,237,0.16);border:1px solid rgba(155,92,255,0.3);color:#b687ff}
        nav{display:flex;gap:26px;color:#aeb5ca;font-size:14px}nav a:hover,nav a.active{color:#fff}
        .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;transition:.2s;border:1px solid transparent}
        .btn.primary{background:linear-gradient(135deg,#7432e8,#933cff);box-shadow:0 10px 30px rgba(124,58,237,.25)}.btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(124,58,237,.35)}
        .btn.outline{border-color:var(--line);background:rgba(255,255,255,.02)}.btn.outline:hover{background:rgba(255,255,255,.06)}
        .large{padding:14px 22px;font-size:15px}
        main{max-width:1180px;margin:auto;padding:0 28px}
        .hero{min-height:690px;display:grid;place-items:center;text-align:center;padding:100px 0 70px}
